metric:
  name: "用户新增活跃活跃用户数"
  english_name: "ads_user_stats__active_user_count"
  description: "用户新增活跃中的活跃用户数。SQL实际定义：SQL实际按注册事实表日期统计，更接近新增注册人数，与字段名疑似不符。 口径核查：SQL计算含义与字段命名疑似对调，new_user_count更像活跃登录用户，active_user_count更像新增注册用户。"
  owner: ""
  business_domain: "电商经营"
  business_process: "用户增长"
  metric_type: "原子指标"
  sensitivity: "内部"
  formula: "SQL实际按注册事实表日期统计，更接近新增注册人数，与字段名疑似不符。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_user_stats"
      fields: ["dt", "recent_days", "active_user_count"]
      join_key: "dt"
  dimensions:
    required: ["dt", "recent_days"]
    optional: []
    commonly: []
    occasionally: []
  granularity:
    time: "统计日 × 1/7/30天"
    entity: "整体"
  unit:
    raw: "个"
    display: "个"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, active_user_count
      FROM ads.ads_user_stats
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_user_stats.sql；上游表: dws.dws_user_user_login_td、dwd.dwd_user_register_inc。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
