metric:
  name: "页面路径页面路径次数"
  english_name: "ads_page_path__path_count"
  description: "页面路径中的页面路径次数。SQL实际定义：按mid_id、自然日和窗口排序相邻页面后，页面边(source→target)出现次数；未按session_id分区。 口径核查：按设备和自然日生成页面边，未按会话ID切分。"
  owner: ""
  business_domain: "电商经营"
  business_process: "页面路径分析"
  metric_type: "原子指标"
  sensitivity: "内部"
  formula: "按mid_id、自然日和窗口排序相邻页面后，页面边(source→target)出现次数；未按session_id分区。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_page_path"
      fields: ["dt", "recent_days", "source", "target", "path_count"]
      join_key: "source"
  dimensions:
    required: ["dt", "recent_days", "source", "target"]
    optional: []
    commonly: []
    occasionally: []
  granularity:
    time: "统计日 × 1/7/30天"
    entity: "页面边"
  unit:
    raw: "个"
    display: "个"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, source, target, path_count
      FROM ads.ads_page_path
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_page_path.sql；上游表: dwd.dwd_traffic_page_view_inc。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
