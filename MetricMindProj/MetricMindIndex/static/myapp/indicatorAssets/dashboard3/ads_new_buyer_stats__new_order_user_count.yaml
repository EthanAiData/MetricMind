metric:
  name: "新增交易用户首次下单用户数"
  english_name: "ads_new_buyer_stats__new_order_user_count"
  description: "新增交易用户中的首次下单用户数。SQL实际定义：首次下单日期落入统计窗口的用户数。 口径核查：SQL使用固定日期2020-06-14作为窗口边界，调度日期变化可能造成口径失真。"
  owner: ""
  business_domain: "电商经营"
  business_process: "新客转化"
  metric_type: "原子指标"
  sensitivity: "内部"
  formula: "首次下单日期落入统计窗口的用户数。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_new_buyer_stats"
      fields: ["dt", "recent_days", "new_order_user_count"]
      join_key: "dt"
  dimensions:
    required: ["dt", "recent_days"]
    optional: []
    commonly: []
    occasionally: []
  granularity:
    time: "统计日 × 1/7/30天"
    entity: "整体"
  unit:
    raw: "个"
    display: "个"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, new_order_user_count
      FROM ads.ads_new_buyer_stats
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_new_buyer_stats.sql；上游表: dws.dws_trade_user_order_td、dws.dws_trade_user_payment_td。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
