metric:
  name: "品牌品类交易品牌金额占比"
  english_name: "ads_trade_stats_by_tm_category__tm_amount_ratio"
  description: "品牌品类交易中的品牌金额占比。SQL实际定义：组合金额 / 同窗口品牌金额 × 100。"
  owner: ""
  business_domain: "电商经营"
  business_process: "品牌品类经营分析"
  metric_type: "派生指标"
  sensitivity: "内部"
  formula: "组合金额 / 同窗口品牌金额 × 100。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (7, 30)"
  source_tables:
    - table: "ads.ads_trade_stats_by_tm_category"
      fields: ["dt", "recent_days", "tm_id", "tm_name", "category1_id", "category1_name", "tm_amount_ratio"]
      join_key: "tm_id"
  dimensions:
    required: ["dt", "recent_days", "tm_id", "tm_name"]
    optional: ["category1_id", "category1_name"]
    commonly: ["category1_id", "category1_name"]
    occasionally: []
  granularity:
    time: "统计日 × 7/30天"
    entity: "品牌/品类"
  unit:
    raw: "百分比数值"
    display: "%"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, tm_id, tm_name, category1_id, category1_name, tm_amount_ratio
      FROM ads.ads_trade_stats_by_tm_category
      WHERE dt = '${pdate}' AND recent_days IN (7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_trade_stats_by_tm_category.sql；上游表: dwd.dwd_trade_order_detail_inc、dim.dim_sku_full。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
