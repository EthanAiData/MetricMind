metric:
  name: "交易总览订单金额"
  english_name: "ads_trade_stats__order_total_amount"
  description: "交易总览中的订单金额。SQL实际定义：统计窗口内订单金额汇总；1天取用户订单日汇总，7/30天取用户订单累计汇总。"
  owner: ""
  business_domain: "电商经营"
  business_process: "交易分析"
  metric_type: "原子指标"
  sensitivity: "内部"
  formula: "统计窗口内订单金额汇总；1天取用户订单日汇总，7/30天取用户订单累计汇总。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_trade_stats"
      fields: ["dt", "recent_days", "order_total_amount"]
      join_key: "dt"
  dimensions:
    required: ["dt", "recent_days"]
    optional: []
    commonly: []
    occasionally: []
  granularity:
    time: "统计日 × 1/7/30天"
    entity: "整体"
  unit:
    raw: "元"
    display: "元"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, order_total_amount
      FROM ads.ads_trade_stats
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_trade_stats.sql；上游表: dws.dws_trade_user_order_1d、dws.dws_trade_user_order_nd、dws.dws_trade_user_order_refund_1d、dws.dws_trade_user_order_refund_nd。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
