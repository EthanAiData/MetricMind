metric:
  name: "品牌交易下单用户数"
  english_name: "ads_trade_stats_by_tm__order_user_count"
  description: "品牌交易中的下单用户数。SQL实际定义：按品牌和窗口去重下单用户数。"
  owner: ""
  business_domain: "电商经营"
  business_process: "品牌经营分析"
  metric_type: "原子指标"
  sensitivity: "内部"
  formula: "按品牌和窗口去重下单用户数。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_trade_stats_by_tm"
      fields: ["dt", "recent_days", "tm_id", "tm_name", "order_user_count"]
      join_key: "tm_id"
  dimensions:
    required: ["dt", "recent_days", "tm_id", "tm_name"]
    optional: []
    commonly: []
    occasionally: []
  granularity:
    time: "统计日 × 1/7/30天"
    entity: "品牌"
  unit:
    raw: "个"
    display: "个"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, tm_id, tm_name, order_user_count
      FROM ads.ads_trade_stats_by_tm
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_trade_stats_by_tm.sql；上游表: dws.dws_trade_user_sku_order_1d/nd、dws.dws_trade_user_sku_order_refund_1d/nd。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
