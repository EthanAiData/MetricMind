metric:
  name: "品类交易订单数"
  english_name: "ads_trade_stats_by_cate__order_count"
  description: "品类交易中的订单数。SQL实际定义：按类目和窗口汇总订单数。"
  owner: ""
  business_domain: "电商经营"
  business_process: "品类经营分析"
  metric_type: "原子指标"
  sensitivity: "内部"
  formula: "按类目和窗口汇总订单数。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_trade_stats_by_cate"
      fields: ["dt", "recent_days", "category1_id", "category1_name", "category2_id", "category2_name", "category3_id", "category3_name", "order_count"]
      join_key: "category1_id"
  dimensions:
    required: ["dt", "recent_days", "category1_id", "category1_name"]
    optional: ["category2_id", "category2_name", "category3_id", "category3_name"]
    commonly: ["category2_id", "category2_name", "category3_id"]
    occasionally: ["category3_name"]
  granularity:
    time: "统计日 × 1/7/30天"
    entity: "品类"
  unit:
    raw: "个"
    display: "个"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, category1_id, category1_name, category2_id, category2_name, category3_id, category3_name, order_count
      FROM ads.ads_trade_stats_by_cate
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_trade_stats_by_cate.sql；上游表: dws.dws_trade_user_sku_order_1d/nd、dws.dws_trade_user_sku_order_refund_1d/nd。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
