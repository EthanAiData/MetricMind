metric:
  name: "省份转化分析平均订单金额"
  english_name: "ads_province_conversion_analysis__average_order_amount"
  description: "省份转化分析中的平均订单金额。SQL实际定义：省内订单金额 / 下单用户数，是人均订单金额，不是每笔订单均价。"
  owner: ""
  business_domain: "电商经营"
  business_process: "区域转化分析"
  metric_type: "派生指标"
  sensitivity: "内部"
  formula: "省内订单金额 / 下单用户数，是人均订单金额，不是每笔订单均价。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_province_conversion_analysis"
      fields: ["dt", "recent_days", "province_id", "province_name", "region_id", "region_name", "average_order_amount"]
      join_key: "province_id"
  dimensions:
    required: ["dt", "recent_days", "province_id", "province_name"]
    optional: ["region_id", "region_name"]
    commonly: ["region_id", "region_name"]
    occasionally: []
  granularity:
    time: "统计日 × 1/7/30天"
    entity: "省份"
  unit:
    raw: "个"
    display: "个"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, province_id, province_name, region_id, region_name, average_order_amount
      FROM ads.ads_province_conversion_analysis
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_province_conversion_analysis.sql；上游表: dwd.dwd_trade_order_detail_inc、dwd.dwd_trade_pay_detail_suc_inc、dim.dim_province_full。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
