metric:
  name: "类目购物车商品排行类目内购物车排名"
  english_name: "ads_sku_cart_num_top10_by_cate__rk"
  description: "类目购物车商品排行中的类目内购物车排名。SQL实际定义：类目分区内购物车数量降序RANK；SQL筛选rk<=3，实际Top3而非Top10，并列可能超3行。 口径核查：SQL条件rk<=3，实际Top3；并列排名会超过3行。"
  owner: ""
  business_domain: "电商经营"
  business_process: "商品分析"
  metric_type: "派生指标"
  sensitivity: "内部"
  formula: "类目分区内购物车数量降序RANK；SQL筛选rk<=3，实际Top3而非Top10，并列可能超3行。"
  filters:
    - "dt = ${pdate}"
    - "recent_days IN (1, 7, 30)"
  source_tables:
    - table: "ads.ads_sku_cart_num_top10_by_cate"
      fields: ["dt", "recent_days", "category1_id", "category1_name", "category2_id", "category2_name", "category3_id", "category3_name", "sku_id", "sku_name", "rk"]
      join_key: "category1_id"
  dimensions:
    required: ["dt", "recent_days", "category1_id", "category1_name"]
    optional: ["category2_id", "category2_name", "category3_id", "category3_name", "sku_id", "sku_name"]
    commonly: ["category2_id", "category2_name", "category3_id"]
    occasionally: ["category3_name", "sku_id", "sku_name"]
  granularity:
    time: "统计日 × 三级类目×SKU"
    entity: "商品"
  unit:
    raw: "名次"
    display: "名次"
    scale_factor: 1
  sql_text:
    sql_from_ads: |
      SELECT dt, recent_days, category1_id, category1_name, category2_id, category2_name, category3_id, category3_name, sku_id, sku_name, rk
      FROM ads.ads_sku_cart_num_top10_by_cate
      WHERE dt = '${pdate}' AND recent_days IN (1, 7, 30);
    sql_from_topicdws: ""
    sql_from_generaldws: ""
    sql_from_dwd: ""
    sql_from_ods: ""
  lineage_status: "partial"
  lineage_note: "逻辑SQL: doris/logical/ads/ads_sku_cart_num_top10_by_cate.sql；上游表: dwd.dwd_trade_cart_full、dim.dim_sku_full。SQL参考查询读取ADS输出，字段级血缘以ETL逻辑为准。"
